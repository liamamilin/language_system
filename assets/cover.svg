<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1120" width="800" height="1120" role="img" aria-label="Concepts Need a Place — Book Cover">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#162338"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#14b8a6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1120" fill="url(#bgGrad)"/>
  <rect width="800" height="1120" fill="url(#halo)"/>

  <!-- Subtle architectural grid -->
  <g stroke="#334155" stroke-opacity="0.22" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="1120"/>
    <line x1="720" y1="0" x2="720" y2="1120"/>
    <line x1="0" y1="96" x2="800" y2="96"/>
    <line x1="0" y1="1024" x2="800" y2="1024"/>
  </g>

  <!-- Top editorial eyebrow -->
  <text x="80" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'PingFang SC', sans-serif" font-size="16" font-weight="600" letter-spacing="3.5">PERSONAL LANGUAGE &amp; CONCEPT ARCHITECTURE</text>
  <rect x="80" y="94" width="160" height="3" rx="1.5" fill="url(#accentLine)"/>

  <!-- Main Title -->
  <text x="80" y="182" fill="#f8fafc" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="-0.8">Concepts</text>
  <text x="80" y="254" fill="#f8fafc" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="-0.8">Need a Place</text>

  <!-- Subtitle -->
  <text x="80" y="302" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="22" font-weight="400">A Personal RU Tree for Reading, Thinking, and Action</text>
  <text x="80" y="336" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="18" font-weight="500">个人生活 RU 树与语言安置系统</text>

  <!-- Central Geometric RU Tree Emblem -->
  <g transform="translate(400, 625)">
    <!-- 4 Concentric Layer Rings: Leaf -> Container -> Group -> Theme -->
    <circle r="235" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 6"/>
    <circle r="175" fill="none" stroke="#38bdf8" stroke-opacity="0.32" stroke-width="1.5"/>
    <circle r="115" fill="none" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle r="56" fill="#0f172a" stroke="#f59e0b" stroke-width="2.2"/>

    <!-- Radial Spokes to 8 Themes -->
    <g stroke="#475569" stroke-width="1.4" stroke-opacity="0.7">
      <line x1="0" y1="-56" x2="0" y2="-212"/>
      <line x1="39.6" y1="-39.6" x2="150" y2="-150"/>
      <line x1="56" y1="0" x2="212" y2="0"/>
      <line x1="39.6" y1="39.6" x2="150" y2="150"/>
      <line x1="0" y1="56" x2="0" y2="212"/>
      <line x1="-39.6" y1="39.6" x2="-150" y2="150"/>
      <line x1="-56" y1="0" x2="-212" y2="0"/>
      <line x1="-39.6" y1="-39.6" x2="-150" y2="-150"/>
    </g>

    <!-- Pair Arcs -->
    <path d="M 0 -175 A 175 175 0 0 1 123.7 -123.7" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 175 0 A 175 175 0 0 1 123.7 123.7" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0 175 A 175 175 0 0 1 -123.7 123.7" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
    <path d="M -175 0 A 175 175 0 0 1 -123.7 -123.7" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

    <!-- Core RU Badge -->
    <text x="0" y="-4" text-anchor="middle" fill="#f8fafc" font-family="Georgia, serif" font-size="24" font-weight="700">RU</text>
    <text x="0" y="18" text-anchor="middle" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.8">TREE</text>

    <!-- 8 Theme Nodes -->
    <!-- Pair 1: Body / Mind (Sky Blue) -->
    <g>
      <circle cx="0" cy="-175" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
      <text x="0" y="-198" text-anchor="middle" fill="#e0f2fe" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">BODY</text>

      <circle cx="123.7" cy="-123.7" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
      <text x="150" y="-142" text-anchor="start" fill="#e0f2fe" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">MIND</text>
    </g>

    <!-- Pair 2: Language / Work (Teal) -->
    <g>
      <circle cx="175" cy="0" r="10" fill="#0f172a" stroke="#2dd4bf" stroke-width="3"/>
      <text x="198" y="5" text-anchor="start" fill="#ccfbf1" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">LANGUAGE</text>

      <circle cx="123.7" cy="123.7" r="10" fill="#0f172a" stroke="#2dd4bf" stroke-width="3"/>
      <text x="150" y="150" text-anchor="start" fill="#ccfbf1" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">WORK</text>
    </g>

    <!-- Pair 3: Relationship / Society (Violet) -->
    <g>
      <circle cx="0" cy="175" r="10" fill="#0f172a" stroke="#a78bfa" stroke-width="3"/>
      <text x="0" y="210" text-anchor="middle" fill="#ede9fe" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">RELATIONSHIP</text>

      <circle cx="-123.7" cy="123.7" r="10" fill="#0f172a" stroke="#a78bfa" stroke-width="3"/>
      <text x="-150" y="150" text-anchor="end" fill="#ede9fe" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">SOCIETY</text>
    </g>

    <!-- Pair 4: Technology / Value (Amber) -->
    <g>
      <circle cx="-175" cy="0" r="10" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
      <text x="-198" y="5" text-anchor="end" fill="#fef3c7" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">TECHNOLOGY</text>

      <circle cx="-123.7" cy="-123.7" r="10" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
      <text x="-150" y="-142" text-anchor="end" fill="#fef3c7" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">VALUE</text>
    </g>

    <!-- Layer legend pills along bottom of emblem -->
    <g transform="translate(0, 260)">
      <rect x="-250" y="-16" width="500" height="32" rx="16" fill="#0f172a" fill-opacity="0.72" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" letter-spacing="1.2">THEME  →  GROUP  →  CONTAINER  →  LEAF</text>
    </g>
  </g>

  <!-- Bottom Author & Tagline -->
  <text x="80" y="992" fill="#94a3b8" font-family="Georgia, serif" font-style="italic" font-size="19">"When a concept has a place, it can be called, tested, connected, and used."</text>
  <text x="80" y="1066" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="22" font-weight="600" letter-spacing="1.5">LIN MI</text>
  <text x="720" y="1066" text-anchor="end" fill="#64748b" font-family="-apple-system, sans-serif" font-size="15" font-weight="500">INTERACTIVE EDITION</text>
</svg>
