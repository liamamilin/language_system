<script>
  (function () {
    function boot() {
      if (window.RUToys && typeof window.RUToys.mountAll === 'function') {
        window.RUToys.mountAll(document);
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  })();
</script>
