<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" role="img" aria-label="Technology Mediation Governed by Value Standards">
  <rect width="920" height="330" rx="14" fill="#ffffff"/>
  <text x="460" y="36" text-anchor="middle" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'PingFang SC', sans-serif" font-size="19" font-weight="700">Technology Mediation Governed by Value（技术中介与价值治理）</text>
  <text x="460" y="58" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12.5">A technical function is never a value judgment — Value defines what counts as good, safe, and worthwhile</text>

  <defs>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Top Governance Layer: Value -->
  <rect x="28" y="78" width="864" height="84" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="48" y="102" fill="#b45309" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1">VALUE GOVERNANCE LAYER（价值判断层）</text>
  <g font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#78350f">
    <rect x="48" y="114" width="185" height="34" rx="7" fill="#ffffff" stroke="#fcd34d"/>
    <text x="140" y="136" text-anchor="middle">Purpose &amp; Priority</text>
    <rect x="254" y="114" width="185" height="34" rx="7" fill="#ffffff" stroke="#fcd34d"/>
    <text x="346" y="136" text-anchor="middle">Quality Standard</text>
    <rect x="460" y="114" width="185" height="34" rx="7" fill="#ffffff" stroke="#fcd34d"/>
    <text x="552" y="136" text-anchor="middle">Cost &amp; Risk Budget</text>
    <rect x="666" y="114" width="206" height="34" rx="7" fill="#ffffff" stroke="#fcd34d"/>
    <text x="769" y="136" text-anchor="middle">Ethics &amp; Accountability</text>
  </g>

  <!-- Downward governance arrows -->
  <line x1="140" y1="162" x2="140" y2="196" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrA)"/>
  <line x1="346" y1="162" x2="346" y2="196" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrA)"/>
  <line x1="552" y1="162" x2="552" y2="196" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrA)"/>
  <line x1="769" y1="162" x2="769" y2="196" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrA)"/>

  <!-- Bottom Execution Layer: Technology -->
  <rect x="28" y="202" width="864" height="104" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="48" y="226" fill="#0369a1" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1">TECHNOLOGY EXECUTION LAYER（技术中介层）</text>

  <g font-family="-apple-system, sans-serif">
    <rect x="48" y="240" width="176" height="50" rx="8" fill="#ffffff" stroke="#7dd3fc"/>
    <text x="136" y="262" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700">Input &amp; Data</text>
    <text x="136" y="279" text-anchor="middle" fill="#64748b" font-size="11">Prompts · Context</text>

    <line x1="224" y1="265" x2="250" y2="265" stroke="#0284c7" stroke-width="2" marker-end="url(#arrS)"/>

    <rect x="256" y="240" width="176" height="50" rx="8" fill="#ffffff" stroke="#7dd3fc"/>
    <text x="344" y="262" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700">Tool / AI Model</text>
    <text x="344" y="279" text-anchor="middle" fill="#64748b" font-size="11">One step, not whole system</text>

    <line x1="432" y1="265" x2="458" y2="265" stroke="#0284c7" stroke-width="2" marker-end="url(#arrS)"/>

    <rect x="464" y="240" width="176" height="50" rx="8" fill="#ffffff" stroke="#7dd3fc"/>
    <text x="552" y="262" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700">Workflow &amp; Review</text>
    <text x="552" y="279" text-anchor="middle" fill="#64748b" font-size="11">Verification · Automation</text>

    <line x1="640" y1="265" x2="666" y2="265" stroke="#0284c7" stroke-width="2" marker-end="url(#arrS)"/>

    <rect x="672" y="240" width="200" height="50" rx="8" fill="#ffffff" stroke="#7dd3fc"/>
    <text x="772" y="262" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700">Trusted Output</text>
    <text x="772" y="279" text-anchor="middle" fill="#64748b" font-size="11">Fluency ≠ Evidence</text>
  </g>
</svg>
