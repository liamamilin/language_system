<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="920" height="460" role="img" aria-label="Eight-Theme RU Tree Map arranged in Four Complementary Pairs">
  <rect width="920" height="460" rx="14" fill="#ffffff"/>
  <text x="460" y="36" text-anchor="middle" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'PingFang SC', sans-serif" font-size="20" font-weight="700">The Eight-Theme Map（八大主题地图）</text>
  <text x="460" y="58" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">Four complementary pairs — closely linked, yet each speaks its own independent Domain Language</text>

  <!-- Pair 1: Body / Mind -->
  <rect x="28" y="80" width="420" height="168" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.6"/>
  <text x="46" y="104" fill="#0369a1" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">PAIR 1 · OPERATING BASE &amp; INNER PROCESSING</text>
  <rect x="44" y="116" width="186" height="118" rx="9" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.2"/>
  <text x="58" y="139" fill="#0284c7" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Body（身体）</text>
  <text x="58" y="160" fill="#334155" font-family="-apple-system, sans-serif" font-size="12">Language of condition</text>
  <text x="58" y="182" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">Energy · Sleep · Diet · Movement</text>
  <text x="58" y="200" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">Health · Sensation · Stress · Pain</text>
  <text x="58" y="222" fill="#0369a1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Q: What physical state limits me?</text>

  <rect x="246" y="116" width="186" height="118" rx="9" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.2"/>
  <text x="260" y="139" fill="#0284c7" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Mind（心智）</text>
  <text x="260" y="160" fill="#334155" font-family="-apple-system, sans-serif" font-size="12">Language of processing</text>
  <text x="260" y="182" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">Perception · Attention · Memory</text>
  <text x="260" y="200" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">Emotion · Motivation · Cognition</text>
  <text x="260" y="222" fill="#0369a1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Q: What inner process is active?</text>

  <!-- Pair 2: Language / Work -->
  <rect x="472" y="80" width="420" height="168" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="490" y="104" fill="#0f766e" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">PAIR 2 · EXPRESSION &amp; EXECUTION</text>
  <rect x="488" y="116" width="186" height="118" rx="9" fill="#ffffff" stroke="#5eead4" stroke-width="1.2"/>
  <text x="502" y="139" fill="#0d9488" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Language（语言）</text>
  <text x="502" y="160" fill="#334155" font-family="-apple-system, sans-serif" font-size="12">Language of expression</text>
  <text x="502" y="182" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">Word · Sentence · Text · Concept</text>
  <text x="502" y="200" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">Question · Argument · Instruction</text>
  <text x="502" y="222" fill="#0f766e" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Q: What needs to be named/said?</text>

  <rect x="690" y="116" width="186" height="118" rx="9" fill="#ffffff" stroke="#5eead4" stroke-width="1.2"/>
  <text x="704" y="139" fill="#0d9488" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Work（工作）</text>
  <text x="704" y="160" fill="#334155" font-family="-apple-system, sans-serif" font-size="12">Language of action</text>
  <text x="704" y="182" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">Goal · Plan · Task · Method</text>
  <text x="704" y="200" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">Project · Practice · Feedback</text>
  <text x="704" y="222" fill="#0f766e" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Q: How does intent become output?</text>

  <!-- Pair 3: Relationship / Society -->
  <rect x="28" y="268" width="420" height="168" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="46" y="292" fill="#6d28d9" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">PAIR 3 · INTERPERSONAL &amp; STRUCTURAL FIELD</text>
  <rect x="44" y="304" width="186" height="118" rx="9" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="58" y="327" fill="#7c3aed" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Relationship（关系）</text>
  <text x="58" y="348" fill="#334155" font-family="-apple-system, sans-serif" font-size="12">Language of access &amp; repair</text>
  <text x="58" y="370" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">Connection · Trust · Boundary</text>
  <text x="58" y="388" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">Intimacy · Conflict · Role</text>
  <text x="58" y="410" fill="#6d28d9" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Q: What arrangement binds us?</text>

  <rect x="246" y="304" width="186" height="118" rx="9" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="260" y="327" fill="#7c3aed" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Society（社会）</text>
  <text x="260" y="348" fill="#334155" font-family="-apple-system, sans-serif" font-size="12">Language of structure</text>
  <text x="260" y="370" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">Role · Group · Org · Institution</text>
  <text x="260" y="388" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">Market · Rule · Career · Platform</text>
  <text x="260" y="410" fill="#6d28d9" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Q: What structure shapes this?</text>

  <!-- Pair 4: Technology / Value -->
  <rect x="472" y="268" width="420" height="168" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="490" y="292" fill="#b45309" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">PAIR 4 · MEDIATION &amp; JUDGMENT</text>
  <rect x="488" y="304" width="186" height="118" rx="9" fill="#ffffff" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="502" y="327" fill="#d97706" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Technology（技术）</text>
  <text x="502" y="348" fill="#334155" font-family="-apple-system, sans-serif" font-size="12">Language of mediated action</text>
  <text x="502" y="370" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">Tool · Software · AI Model · Data</text>
  <text x="502" y="388" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">System · Platform · Automation</text>
  <text x="502" y="410" fill="#b45309" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Q: What mediates action here?</text>

  <rect x="690" y="304" width="186" height="118" rx="9" fill="#ffffff" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="704" y="327" fill="#d97706" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Value（价值）</text>
  <text x="704" y="348" fill="#334155" font-family="-apple-system, sans-serif" font-size="12">Language of judgment</text>
  <text x="704" y="370" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">Importance · Benefit · Cost · Risk</text>
  <text x="704" y="388" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">Purpose · Standard · Ethics</text>
  <text x="704" y="410" fill="#b45309" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Q: What matters &amp; at what cost?</text>
</svg>
