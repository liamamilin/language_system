<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img" aria-label="Four-Layer RU Tree Structure: Theme, Group, Container, Leaf">
  <rect width="920" height="360" rx="14" fill="#ffffff"/>
  <text x="460" y="38" text-anchor="middle" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'PingFang SC', sans-serif" font-size="20" font-weight="700">The Four-Layer RU Tree Architecture（四层安置结构）</text>
  <text x="460" y="60" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13">Each layer narrows a concept from a broad life domain to a callable sentence and action</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Layer 1: Theme -->
  <rect x="32" y="88" width="188" height="176" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <rect x="32" y="88" width="188" height="34" rx="12" fill="#0284c7"/>
  <rect x="32" y="108" width="188" height="14" fill="#0284c7"/>
  <text x="126" y="110" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">1. THEME（主题域）</text>
  <text x="126" y="148" text-anchor="middle" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">What kind of world?</text>
  <text x="126" y="170" text-anchor="middle" fill="#475569" font-family="-apple-system, sans-serif" font-size="12">8 fixed life domains</text>
  <line x1="52" y1="188" x2="200" y2="188" stroke="#bae6fd" stroke-width="1"/>
  <text x="126" y="212" text-anchor="middle" fill="#0369a1" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Value</text>
  <text x="126" y="234" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">Language of judgment</text>

  <line x1="220" y1="176" x2="250" y2="176" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Layer 2: Group -->
  <rect x="256" y="88" width="188" height="176" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <rect x="256" y="88" width="188" height="34" rx="12" fill="#0d9488"/>
  <rect x="256" y="108" width="188" height="14" fill="#0d9488"/>
  <text x="350" y="110" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">2. GROUP（分组）</text>
  <text x="350" y="148" text-anchor="middle" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Which neighborhood?</text>
  <text x="350" y="170" text-anchor="middle" fill="#475569" font-family="-apple-system, sans-serif" font-size="12">8 families per Theme</text>
  <line x1="276" y1="188" x2="424" y2="188" stroke="#99f6e4" stroke-width="1"/>
  <text x="350" y="212" text-anchor="middle" fill="#0f766e" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Cost</text>
  <text x="350" y="234" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">What is spent or foregone</text>

  <line x1="444" y1="176" x2="474" y2="176" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Layer 3: Container (Highlighted Core) -->
  <rect x="480" y="82" width="196" height="188" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <rect x="480" y="82" width="196" height="36" rx="12" fill="#d97706"/>
  <rect x="480" y="104" width="196" height="14" fill="#d97706"/>
  <text x="578" y="106" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">3. CONTAINER（容器）★</text>
  <text x="578" y="144" text-anchor="middle" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">What callable holder?</text>
  <text x="578" y="166" text-anchor="middle" fill="#475569" font-family="-apple-system, sans-serif" font-size="12">Primary operational layer</text>
  <line x1="500" y1="184" x2="656" y2="184" stroke="#fde68a" stroke-width="1"/>
  <text x="578" y="208" text-anchor="middle" fill="#b45309" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Opportunity Cost</text>
  <text x="578" y="230" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">Prevents counting money only</text>
  <text x="578" y="250" text-anchor="middle" fill="#b45309" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Produces usable sentences</text>

  <line x1="676" y1="176" x2="704" y2="176" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Layer 4: Leaf -->
  <rect x="710" y="88" width="178" height="176" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="710" y="88" width="178" height="34" rx="12" fill="#7c3aed"/>
  <rect x="710" y="108" width="178" height="14" fill="#7c3aed"/>
  <text x="799" y="110" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">4. LEAF（叶子）</text>
  <text x="799" y="148" text-anchor="middle" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">What exact case?</text>
  <text x="799" y="170" text-anchor="middle" fill="#475569" font-family="-apple-system, sans-serif" font-size="12">Infinite lived instances</text>
  <line x1="728" y1="188" x2="870" y2="188" stroke="#ddd6fe" stroke-width="1"/>
  <text x="799" y="210" text-anchor="middle" fill="#6d28d9" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700">The weekend lost</text>
  <text x="799" y="228" text-anchor="middle" fill="#6d28d9" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700">to an extra project</text>
  <text x="799" y="248" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Triggers concrete choice</text>

  <!-- Bottom Use Sentence Banner -->
  <rect x="32" y="290" width="856" height="48" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="52" y="319" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">CALLABLE SENTENCE:</text>
  <text x="214" y="319" fill="#334155" font-family="Georgia, serif" font-style="italic" font-size="13.5">"This project carries an opportunity cost: it takes the weekend I need for recovery."</text>
</svg>
