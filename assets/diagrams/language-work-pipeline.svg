<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" width="920" height="310" role="img" aria-label="Language to Work Execution Pipeline">
  <rect width="920" height="310" rx="14" fill="#ffffff"/>
  <text x="460" y="36" text-anchor="middle" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'PingFang SC', sans-serif" font-size="19" font-weight="700">From Clear Language to Executable Work（从清晰语言到可执行工作）</text>
  <text x="460" y="58" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12.5">Language names the problem and standard; Work turns that clarity into tasks, artifacts, and feedback loops</text>

  <defs>
    <marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488"/>
    </marker>
  </defs>

  <!-- Language Side -->
  <rect x="28" y="84" width="404" height="148" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="48" y="108" fill="#0f766e" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">LANGUAGE DOMAIN（表达与界定）</text>

  <rect x="46" y="124" width="168" height="90" rx="9" fill="#ffffff" stroke="#5eead4" stroke-width="1.3"/>
  <text x="130" y="148" text-anchor="middle" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">Term &amp; Question</text>
  <text x="130" y="170" text-anchor="middle" fill="#475569" font-family="-apple-system, sans-serif" font-size="11.5">Definition · Boundary</text>
  <text x="130" y="190" text-anchor="middle" fill="#0d9488" font-family="-apple-system, sans-serif" font-size="11">Diagnostic Question</text>

  <line x1="214" y1="169" x2="240" y2="169" stroke="#0d9488" stroke-width="2" marker-end="url(#arrT)"/>

  <rect x="246" y="124" width="168" height="90" rx="9" fill="#ffffff" stroke="#5eead4" stroke-width="1.3"/>
  <text x="330" y="148" text-anchor="middle" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">Claim &amp; Instruction</text>
  <text x="330" y="170" text-anchor="middle" fill="#475569" font-family="-apple-system, sans-serif" font-size="11.5">Evidence · Prompt</text>
  <text x="330" y="190" text-anchor="middle" fill="#0d9488" font-family="-apple-system, sans-serif" font-size="11">Acceptance Criteria</text>

  <!-- Bridge Arrow -->
  <line x1="432" y1="158" x2="482" y2="158" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrT)"/>

  <!-- Work Side -->
  <rect x="488" y="84" width="404" height="148" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.6"/>
  <text x="508" y="108" fill="#0369a1" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">WORK DOMAIN（行动与交付）</text>

  <rect x="506" y="124" width="168" height="90" rx="9" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.3"/>
  <text x="590" y="148" text-anchor="middle" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">Single Action Task</text>
  <text x="590" y="170" text-anchor="middle" fill="#475569" font-family="-apple-system, sans-serif" font-size="11.5">Milestone · Next Move</text>
  <text x="590" y="190" text-anchor="middle" fill="#0284c7" font-family="-apple-system, sans-serif" font-size="11">Removes start friction</text>

  <line x1="674" y1="169" x2="700" y2="169" stroke="#0284c7" stroke-width="2" marker-end="url(#arrT)"/>

  <rect x="706" y="124" width="168" height="90" rx="9" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.3"/>
  <text x="790" y="148" text-anchor="middle" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">Artifact &amp; Loop</text>
  <text x="790" y="170" text-anchor="middle" fill="#475569" font-family="-apple-system, sans-serif" font-size="11.5">Shippable Output</text>
  <text x="790" y="190" text-anchor="middle" fill="#0284c7" font-family="-apple-system, sans-serif" font-size="11">Feedback Loop</text>

  <!-- Return Feedback Arc -->
  <path d="M 790 232 L 790 272 L 130 272 L 130 238" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrT)"/>
  <rect x="330" y="258" width="260" height="26" rx="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="460" y="275" text-anchor="middle" fill="#334155" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">Feedback refines definitions &amp; next tasks</text>
</svg>
