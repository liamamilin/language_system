<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="920" height="340" role="img" aria-label="Relationship vs Society Structural Boundary">
  <rect width="920" height="340" rx="14" fill="#ffffff"/>
  <text x="460" y="36" text-anchor="middle" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'PingFang SC', sans-serif" font-size="19" font-weight="700">Relationship vs. Society: Separating Arrangement from Structure（关系安排与社会结构分离）</text>

  <!-- Left: Relationship -->
  <rect x="28" y="68" width="416" height="242" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="50" y="96" fill="#6d28d9" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">RELATIONSHIP（关系）— Between Specific People</text>
  <text x="50" y="118" fill="#475569" font-family="-apple-system, sans-serif" font-size="12">Live arrangement of access, trust, boundary, and repair</text>

  <g font-family="-apple-system, sans-serif" font-size="12.5">
    <rect x="48" y="134" width="180" height="44" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="138" y="161" text-anchor="middle" fill="#1e293b" font-weight="600">Contact ≠ Intimacy</text>

    <rect x="242" y="134" width="182" height="44" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="333" y="161" text-anchor="middle" fill="#1e293b" font-weight="600">Apology ≠ Trust Repair</text>

    <rect x="48" y="190" width="180" height="44" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="138" y="217" text-anchor="middle" fill="#1e293b" font-weight="600">Boundary ≠ Rejection</text>

    <rect x="242" y="190" width="182" height="44" rx="8" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="333" y="217" text-anchor="middle" fill="#1e293b" font-weight="600">Role Clarity ≠ Coldness</text>
  </g>
  <text x="50" y="264" fill="#6d28d9" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">First Move:</text>
  <text x="122" y="264" fill="#334155" font-family="-apple-system, sans-serif" font-size="12">Name the Group, state expectations, renegotiate access.</text>
  <text x="50" y="288" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">Trap: Reading structural rules as personal betrayal.</text>

  <!-- Right: Society -->
  <rect x="476" y="68" width="416" height="242" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="1.8"/>
  <text x="498" y="96" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">SOCIETY（社会）— Beyond Any Single Person</text>
  <text x="498" y="118" fill="#475569" font-family="-apple-system, sans-serif" font-size="12">Institutions, markets, rules, incentives, and platform ecologies</text>

  <g font-family="-apple-system, sans-serif" font-size="12.5">
    <rect x="496" y="134" width="180" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="586" y="161" text-anchor="middle" fill="#1e293b" font-weight="600">Role &amp; Organization</text>

    <rect x="690" y="134" width="182" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="781" y="161" text-anchor="middle" fill="#1e293b" font-weight="600">Institution &amp; Rule</text>

    <rect x="496" y="190" width="180" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="586" y="217" text-anchor="middle" fill="#1e293b" font-weight="600">Market &amp; Career</text>

    <rect x="690" y="190" width="182" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="781" y="217" text-anchor="middle" fill="#1e293b" font-weight="600">Platform Ecology</text>
  </g>
  <text x="498" y="264" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">First Move:</text>
  <text x="570" y="264" fill="#334155" font-family="-apple-system, sans-serif" font-size="12">Locate incentives, rules, and position before self-blame.</text>
  <text x="498" y="288" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">Trap: Trying to solve market/rule design with pure politeness.</text>
</svg>
